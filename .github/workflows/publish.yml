name: Publish

# Publishes the npm package when a GitHub release is published, with an
# npm provenance attestation, and attaches a CycloneDX SBOM to the
# release (security review nit 13).
#
# npm TRUSTED PUBLISHING (OIDC) — no npm token exists anywhere: npm
# exchanges this workflow's GitHub OIDC identity for a one-off publish
# credential. It works only after the maintainer has registered this
# repository + `publish.yml` as the package's trusted publisher on
# npmjs.com (CONTRIBUTING.md "Releasing"); until then `npm publish` here
# fails with an authentication error and nothing is published.
#
# Hardening, each for a reason:
#   - actions pinned by commit SHA (see ci.yml);
#   - the release tag is passed through `env:`, never spliced into a
#     `run:` script, so a crafted tag name cannot become shell;
#   - the tag must equal package.json's version, so a release can only
#     publish the version it names;
#   - TWO jobs. `verify` runs every gate CI runs, plus `npm audit`, on the
#     release commit and packs the tarball; it executes dependency code
#     (tsup / esbuild, vitest, biome, tsc) and therefore holds NO
#     id-token permission. `publish` holds `id-token: write` and runs no
#     dependency or repository code at all: no checkout, no `npm ci`, no
#     scripts — it downloads the packed tarball, checks its name, digest
#     and embedded package.json against the tag, and publishes THAT file.
#     A job with `id-token: write` exposes the OIDC request token to every
#     step, so in one job a compromised devDependency could mint the npm
#     credential and publish any version with valid provenance (review
#     round 1). What remains: compromised build tooling can still poison
#     the tarball `verify` packs — it cannot publish anything else;
#   - `npm ci --ignore-scripts`: no dependency install script runs; the
#     build is explicit; `npm pack --ignore-scripts` and
#     `npm publish --ignore-scripts` ship exactly the dist/ that was
#     built and tested;
#   - the SBOM job, the only one with write access to the release, runs
#     no dependency code at all (it reads package-lock.json).

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: gates + pack (no publish credential)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Release tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "release tag '${RELEASE_TAG}' does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint + format check
        run: npm run check
      - name: Audit
        run: npm audit
      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --silent | tail -n1)"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum "${tarball}" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: npm publish (provenance)
    needs: verify
    # Off until the maintainer has registered this workflow as the package's
    # trusted publisher on npmjs.com and set the repository variable
    # NPM_TRUSTED_PUBLISHING=true (CONTRIBUTING.md). Until then the job is
    # skipped, verify still runs, and releases are published by hand.
    if: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance — this job only
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TARBALL: ${{ needs.verify.outputs.tarball }}
      TARBALL_SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 bundles npm 11; trusted publishing needs npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm supports trusted publishing
        run: |
          min=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "${min}" "${have}" | sort -V | head -n1)" != "${min}" ]; then
            echo "npm ${have} is older than ${min}, the first with trusted publishing" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
      - name: Tarball is the one verify packed, for the tagged version
        run: |
          expected="loomiomcp-${RELEASE_TAG#v}.tgz"
          if [ "${TARBALL}" != "${expected}" ] || [ ! -f "${expected}" ]; then
            echo "expected ${expected}, verify packed '${TARBALL}'" >&2
            exit 1
          fi
          if [ "$(sha256sum "${expected}" | cut -d' ' -f1)" != "${TARBALL_SHA256}" ]; then
            echo "${expected} does not match the digest verify recorded" >&2
            exit 1
          fi
          # The package.json INSIDE the tarball names the package and version.
          tar -xzOf "${expected}" package/package.json > embedded-package.json
          name="$(node -p 'require("./embedded-package.json").name')"
          version="$(node -p 'require("./embedded-package.json").version')"
          if [ "${name}" != "loomiomcp" ] || [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "tarball holds ${name}@${version}, release is ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Publish
        run: npm publish "./${TARBALL}" --provenance --access public --ignore-scripts

  sbom:
    name: attach CycloneDX SBOM
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate SBOM from the lockfile
        run: npm sbom --sbom-format cyclonedx --package-lock-only > "loomiomcp-${RELEASE_TAG}.cdx.json"
      - name: Attach to the release
        run: gh release upload "${RELEASE_TAG}" "loomiomcp-${RELEASE_TAG}.cdx.json" --repo "${GITHUB_REPOSITORY}" --clobber
