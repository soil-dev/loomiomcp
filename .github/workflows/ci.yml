name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned by full commit SHA, not by a movable tag:
# whoever can push a tag in an action's repository could otherwise change
# what runs here (security review nit 13). The comment names the release
# the SHA was resolved from; Dependabot (.github/dependabot.yml) proposes
# the bumps and rewrites both together. `persist-credentials: false`: CI
# never pushes, so the checkout token is not left in .git/config for the
# steps (and dependency scripts) that follow.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint + format check
        run: npm run check
      - name: Build
        run: npm run build
